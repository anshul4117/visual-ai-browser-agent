services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: visual-ai-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - MONGODB_URI=mongodb://mongodb:27017/visual-ai-browser-agent
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: visual-ai-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=visual-ai-browser-agent
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local
