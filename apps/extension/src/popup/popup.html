<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual AI Browser Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1 class="popup-title">Visual AI</h1>
      <span class="popup-subtitle">Browser Agent</span>
    </header>

    <!-- Connection & Status Section -->
    <div class="status-section">
      <div class="status-row">
        <span class="status-label">Status</span>
        <span id="status-indicator" class="status-badge status-active">Active</span>
      </div>
      <div class="status-row">
        <span class="status-label">Backend Connection</span>
        <span id="connection-indicator" class="status-badge connection-connected">Connected</span>
      </div>
    </div>

    <!-- AI Vision Analysis Card Section -->
    <div class="ai-card">
      <div class="ai-card-header">
        <span class="ai-card-title">🤖 AI Vision Insights</span>
        <span id="ai-category-badge" class="badge badge-category">Development</span>
      </div>
      <div class="ai-card-body">
        <p id="ai-summary-text" class="ai-summary">Waiting for first screenshot analysis...</p>
        <div class="score-container">
          <div class="score-label-row">
            <span class="score-title">Productivity Score</span>
            <span id="ai-score-value" class="score-value">85 / 100</span>
          </div>
          <div class="score-bar-bg">
            <div id="ai-score-bar" class="score-bar-fill" style="width: 85%;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Visual Context Statistics Section -->
    <div class="info-section">
      <div class="info-row">
        <span class="info-label">Session ID</span>
        <span id="session-id" class="info-value mono">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Screenshots Captured</span>
        <span id="screenshot-count" class="info-value">0</span>
      </div>
      <div class="info-row">
        <span class="info-label">Last Screenshot</span>
        <span id="last-capture-time" class="info-value">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Offline Queue</span>
        <span id="queued-count" class="info-value">0 items</span>
      </div>
    </div>

    <!-- Backend URL Configuration Section -->
    <div class="config-section">
      <label for="backend-url-input" class="config-label">Backend Server URL</label>
      <div class="config-input-group">
        <input type="text" id="backend-url-input" class="config-input" placeholder="http://localhost:3000" />
        <button id="btn-save-url" class="btn btn-secondary btn-sm" type="button">Save</button>
      </div>
    </div>

    <!-- Primary Action Buttons -->
    <div class="actions-grid">
      <button id="btn-analyze" class="btn btn-ai" type="button">Analyze Latest Screenshot</button>
      <div class="actions-row">
        <button id="btn-view-screenshot" class="btn btn-info" type="button">View Image</button>
        <button id="btn-sync-now" class="btn btn-success" type="button">Sync Now</button>
        <button id="btn-export" class="btn btn-primary" type="button">Export</button>
      </div>
    </div>

    <!-- Secondary Action -->
    <div class="actions-secondary">
      <button id="btn-clear" class="btn btn-danger btn-block" type="button">Clear Queues</button>
    </div>

    <!-- Screenshot Modal Preview -->
    <div id="screenshot-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Latest Captured Screenshot</h3>
          <button id="btn-close-modal" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <img id="screenshot-preview-img" src="" alt="Latest Screenshot" />
          <p id="screenshot-meta-text" class="modal-caption"></p>
        </div>
      </div>
    </div>

    <footer class="popup-footer">
      <span class="footer-text">v1.0.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
