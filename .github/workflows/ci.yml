name: CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Typecheck and Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types Package
        run: npm run build --workspace=packages/shared-types

      - name: Typecheck Workspaces
        run: |
          npm run typecheck --workspace=apps/extension
          npm run typecheck --workspace=apps/server

      - name: Build Extension
        run: npm run build --workspace=apps/extension

      - name: Build Server
        run: npm run build --workspace=apps/server
